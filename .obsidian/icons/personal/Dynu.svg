  <g filter="url(#shadow)">
    <text x="30" y="195" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="190" fill="url(#textGrad)" letter-spacing="-3">Dynu</text>

    <path d="M 572 88 A 180 180 0 0 1 828 88" stroke="url(#blueGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M 612 127 A 125 125 0 0 1 788 127" stroke="url(#greenGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M 651 166 A 70 70 0 0 1 749 166" stroke="url(#yellowGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>

    <circle cx="700" cy="215" r="26" fill="url(#redGrad)"/>
