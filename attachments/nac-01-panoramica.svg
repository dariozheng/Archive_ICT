<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Panoramica NAC: dispositivo, switch, Cisco ISE, profili di autorizzazione e log" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr-0E7490" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><rect x="0.0" y="0.0" width="1280.0" height="720.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="56.0" y="52.0" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Come Cisco ISE decide l'accesso</text><text x="56.0" y="84.0" font-size="16" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Lo switch inoltra la richiesta, ISE valuta gli attributi e restituisce il profilo che lo switch applica alla porta</text><rect x="56.0" y="200.0" width="230.0" height="110.0" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><text x="171.0" y="234.0" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Dispositivo</text><text x="171.0" y="256.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">PC aziendale, consulente o</text><text x="171.0" y="277.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">ospite</text><rect x="386.0" y="200.0" width="230.0" height="110.0" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="2"/><text x="501.0" y="244.5" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Switch di accesso</text><text x="501.0" y="267.4" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">porta 802.1X / MAB</text><rect x="776.0" y="140.0" width="448.0" height="220.0" rx="12" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/><text x="1000.0" y="172.0" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Cisco ISE</text><text x="1000.0" y="198.0" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">valuta gli attributi della connessione</text><rect x="794.0" y="226.0" width="196.0" height="44.0" rx="22.0" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/><text x="892.0" y="248.0" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Identità utente</text><rect x="1010.0" y="226.0" width="196.0" height="44.0" rx="22.0" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/><text x="1108.0" y="248.0" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Tipo di dispositivo</text><rect x="794.0" y="282.0" width="196.0" height="44.0" rx="22.0" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/><text x="892.0" y="304.0" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Posizione</text><rect x="1010.0" y="282.0" width="196.0" height="44.0" rx="22.0" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/><text x="1108.0" y="304.0" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Contesto connessione</text><polyline points="286.0,255.0 386.0,255.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="297.4" y="223.0" width="77.2" height="22.0" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="336.0" y="234.0" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle" dominant-baseline="central">si collega</text><polyline points="616.0,235.0 776.0,235.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="632.1" y="203.0" width="127.8" height="22.0" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="696.0" y="214.0" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle" dominant-baseline="central">richiesta RADIUS</text><polyline points="776.0,277.0 616.0,277.0" fill="none" stroke="#0E7490" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-0E7490)"/><rect x="667.4" y="287.0" width="57.1" height="22.0" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="696.0" y="298.0" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle" dominant-baseline="central">profilo</text><rect x="56.0" y="400.0" width="660.0" height="290.0" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="74.0" y="422.0" font-size="14" font-weight="600" fill="#475569" text-anchor="start" dominant-baseline="central">Profilo di autorizzazione applicato alla porta</text><polyline points="501.0,310.0 501.0,400.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="469.8" y="344.0" width="62.5" height="22.0" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="501.0" y="355.0" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle" dominant-baseline="central">applica</text><rect x="76.0" y="440.0" width="300.0" height="92.0" rx="12" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/><text x="226.0" y="475.5" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">VLAN ADMIN</text><text x="226.0" y="498.4" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">amministratori infrastruttura</text><rect x="396.0" y="440.0" width="300.0" height="92.0" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/><text x="546.0" y="465.0" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">VLAN CLIENT</text><text x="546.0" y="487.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">utenti Publiacqua, accesso</text><text x="546.0" y="508.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">trasparente</text><rect x="76.0" y="548.0" width="300.0" height="92.0" rx="12" fill="#FEFCE8" stroke="#A16207" stroke-width="2"/><text x="226.0" y="573.0" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">VLAN GUEST</text><text x="226.0" y="595.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">non riconosciuti: internet solo se</text><text x="226.0" y="616.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">autorizzati</text><rect x="396.0" y="548.0" width="300.0" height="92.0" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><text x="546.0" y="583.5" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Accesso negato</text><text x="546.0" y="606.4" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">MAC address in blacklist</text><text x="76.0" y="664.0" font-size="14" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Ogni profilo può aggiungere una ACL che limita gli IP raggiungibili</text><rect x="820.0" y="430.0" width="360.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="1000.0" y="459.0" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Log interno ISE</text><text x="1000.0" y="481.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">autenticazioni e autorizzazioni</text><text x="1000.0" y="502.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">monitoraggio · troubleshooting</text><polyline points="1000.0,360.0 1000.0,430.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="967.4" y="384.0" width="65.2" height="22.0" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="1000.0" y="395.0" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle" dominant-baseline="central">registra</text><rect x="820.0" y="590.0" width="360.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="1000.0" y="629.5" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Server log esterno</text><text x="1000.0" y="652.4" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">conservazione oltre il limite locale</text><polyline points="1000.0,530.0 1000.0,590.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="903.0" y="549.0" width="193.9" height="22.0" rx="5" fill="#FFFFFF" stroke="none" stroke-width="1.2"/><text x="1000.0" y="560.0" font-size="14" font-weight="500" fill="#0F172A" text-anchor="middle" dominant-baseline="central">inoltro per retention estesa</text></svg>