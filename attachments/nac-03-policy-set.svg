<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Policy set ISE: Blacklist MAC, Infrastructure Admin, Client Access, pre-login, MAB Access, Guest Access" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arr-CBD5E1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/></marker></defs><rect x="0.0" y="0.0" width="1280.0" height="720.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="56.0" y="52.0" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Policy set: ordine di valutazione</text><text x="56.0" y="84.0" font-size="16" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">ISE valuta le regole dall'alto verso il basso e applica la prima che corrisponde</text><rect x="110.0" y="124.0" width="1114.0" height="76.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="148" cy="162.0" r="16" fill="#B91C1C"/><text x="148.0" y="162.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text><text x="182.0" y="150.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">Blacklist MAC</text><text x="182.0" y="176.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">MAC address presente nella blacklist</text><polyline points="800.0,162.0 848.0,162.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="856.0" y="132.0" width="352.0" height="60.0" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><text x="1032.0" y="152.2" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Accesso negato</text><text x="1032.0" y="172.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">bloccato subito</text><rect x="110.0" y="210.0" width="1114.0" height="76.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="148" cy="248.0" r="16" fill="#BE185D"/><text x="148.0" y="248.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text><text x="182.0" y="236.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">Infrastructure Admin</text><text x="182.0" y="262.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">gruppo AD Infrastructure Admin · solo certificato utente</text><polyline points="800.0,248.0 848.0,248.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="856.0" y="218.0" width="352.0" height="60.0" rx="12" fill="#FDF2F8" stroke="#BE185D" stroke-width="2"/><text x="1032.0" y="238.2" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">VLAN ADMIN</text><text x="1032.0" y="258.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">accesso amministrativo</text><rect x="110.0" y="296.0" width="1114.0" height="76.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="148" cy="334.0" r="16" fill="#1D4ED8"/><text x="148.0" y="334.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text><text x="182.0" y="322.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">Client Access</text><text x="182.0" y="348.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">certificato utente + certificato computer (utente loggato)</text><polyline points="800.0,334.0 848.0,334.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="856.0" y="304.0" width="352.0" height="60.0" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/><text x="1032.0" y="324.2" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">VLAN CLIENT</text><text x="1032.0" y="344.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">accesso completo</text><rect x="110.0" y="382.0" width="1114.0" height="76.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="148" cy="420.0" r="16" fill="#64748B"/><text x="148.0" y="420.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3b</text><text x="182.0" y="408.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">Client Access · prima del login</text><text x="182.0" y="434.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">solo certificato computer: l'utente non ha ancora fatto login</text><polyline points="800.0,420.0 848.0,420.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="856.0" y="390.0" width="352.0" height="60.0" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1032.0" y="410.2" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Pre-autenticazione</text><text x="1032.0" y="430.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">permessi limitati</text><rect x="110.0" y="468.0" width="1114.0" height="76.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="148" cy="506.0" r="16" fill="#4338CA"/><text x="148.0" y="506.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text><text x="182.0" y="494.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">MAB Access</text><text x="182.0" y="520.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">MAC address registrato (es. consulente senza account AD)</text><polyline points="800.0,506.0 848.0,506.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="856.0" y="476.0" width="352.0" height="60.0" rx="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/><text x="1032.0" y="496.2" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Profilo MAB</text><text x="1032.0" y="516.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">profilo specializzato</text><rect x="110.0" y="554.0" width="1114.0" height="76.0" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><circle cx="148" cy="592.0" r="16" fill="#A16207"/><text x="148.0" y="592.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text><text x="182.0" y="580.0" font-size="18" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">Guest Access</text><text x="182.0" y="606.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">nessuna regola precedente soddisfatta o autenticazione fallita</text><polyline points="800.0,592.0 848.0,592.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="856.0" y="562.0" width="352.0" height="60.0" rx="12" fill="#FEFCE8" stroke="#A16207" stroke-width="2"/><text x="1032.0" y="582.2" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">VLAN GUEST</text><text x="1032.0" y="602.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">internet solo se autorizzato</text><polyline points="72.0,130.0 72.0,624.0" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-CBD5E1)"/><text x="110.0" y="672.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Regole e profili si possono modificare in qualsiasi momento dalla console ISE.</text></svg>