<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Ciclo di vita dei certificati: emissione via GPO e template SubCA, revoca e sincronizzazione con ISE" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect x="0.0" y="0.0" width="1280.0" height="720.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="56.0" y="52.0" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start" dominant-baseline="central">Ciclo di vita dei certificati</text><text x="56.0" y="84.0" font-size="16" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">Emissione automatica tramite GPO; una revoca sulla SubCA rende inutilizzabile il certificato sul PC</text><text x="56.0" y="150.0" font-size="15" font-weight="700" fill="#475569" text-anchor="start" dominant-baseline="central">Emissione automatica</text><rect x="56.0" y="170.0" width="210.0" height="120.0" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/><text x="161.0" y="209.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Onboarding GPO</text><text x="161.0" y="229.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">il Domain Controller</text><text x="161.0" y="250.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">avvia l'emissione</text><rect x="295.5" y="170.0" width="210.0" height="120.0" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="400.5" y="209.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Template</text><text x="400.5" y="229.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Utente → SubCA01</text><text x="400.5" y="250.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">Computer → SubCA02</text><polyline points="266.0,230.0 293.5,230.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="535.0" y="170.0" width="210.0" height="120.0" rx="12" fill="#F8FAFC" stroke="#334155" stroke-width="2"/><text x="640.0" y="209.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Installazione sul PC</text><text x="640.0" y="229.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">chiave privata non</text><text x="640.0" y="250.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">esportabile</text><polyline points="505.5,230.0 533.0,230.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="774.5" y="170.0" width="210.0" height="120.0" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="879.5" y="209.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Registro certificati</text><text x="879.5" y="229.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">validi sulla SubCA,</text><text x="879.5" y="250.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">sincronizzato con ISE</text><polyline points="745.0,230.0 772.5,230.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="1014.0" y="170.0" width="210.0" height="120.0" rx="12" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/><text x="1119.0" y="219.5" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Accesso consentito</text><text x="1119.0" y="240.4" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">ISE valida il certificato</text><polyline points="984.5,230.0 1012.0,230.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><text x="56.0" y="370.0" font-size="15" font-weight="700" fill="#475569" text-anchor="start" dominant-baseline="central">Revoca</text><rect x="56.0" y="390.0" width="210.0" height="120.0" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="161.0" y="429.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Revoca</text><text x="161.0" y="449.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">l'operatore revoca il</text><text x="161.0" y="470.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">certificato sulla SubCA</text><rect x="295.5" y="390.0" width="210.0" height="120.0" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/><text x="400.5" y="429.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Registro aggiornato</text><text x="400.5" y="449.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">il certificato non risulta</text><text x="400.5" y="470.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">più valido</text><polyline points="266.0,450.0 293.5,450.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="535.0" y="390.0" width="210.0" height="120.0" rx="12" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/><text x="640.0" y="429.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Sync con ISE</text><text x="640.0" y="449.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">ISE riceve il registro</text><text x="640.0" y="470.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">aggiornato</text><polyline points="505.5,450.0 533.0,450.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="774.5" y="390.0" width="210.0" height="120.0" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><text x="879.5" y="429.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Autenticazione fallita</text><text x="879.5" y="449.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">il certificato sul PC non</text><text x="879.5" y="470.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">basta più</text><polyline points="745.0,450.0 772.5,450.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="1014.0" y="390.0" width="210.0" height="120.0" rx="12" fill="#FEFCE8" stroke="#A16207" stroke-width="2"/><text x="1119.0" y="429.0" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Guest Access</text><text x="1119.0" y="449.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">nessun accesso alla rete</text><text x="1119.0" y="470.9" font-size="15" font-weight="400" fill="#475569" text-anchor="middle" dominant-baseline="central">aziendale</text><polyline points="984.5,450.0 1012.0,450.0" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-475569)"/><rect x="56.0" y="580.0" width="1168.0" height="96.0" rx="12" fill="#FDF2F8" stroke="#BE185D" stroke-width="1.5"/><text x="80.0" y="610.0" font-size="17" font-weight="600" fill="#0F172A" text-anchor="start" dominant-baseline="central">Certificato utente degli amministratori</text><text x="80.0" y="642.0" font-size="15" font-weight="400" fill="#475569" text-anchor="start" dominant-baseline="central">È legato al PC su cui è stato installato: la chiave privata non è esportabile, quindi non può essere usato su altri PC.</text></svg>